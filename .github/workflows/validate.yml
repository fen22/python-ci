name: validate
on:
  pull_request:
  push:
    branches: [master, main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install jsonschema pyyaml
      - run: python scripts/validate.py
      - run: python scripts/build_catalog.py
